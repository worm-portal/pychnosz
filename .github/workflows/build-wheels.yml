name: Build Wheels

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Use ubuntu-latest for Linux, windows-2019 for Windows
        # For macOS: macos-15-intel (Intel x86_64) and macos-latest (Apple Silicon ARM64)
        os: [ubuntu-latest, windows-2019, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.16.5

      - name: Set up MinGW on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-fortran

      - name: Install gfortran on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Find gfortran location
          GFORTRAN_PATH=$(brew --prefix gcc)/bin/gfortran
          echo "Installed gfortran at: $GFORTRAN_PATH"

          # Check what architecture(s) it supports
          lipo -info "$GFORTRAN_PATH" || file "$GFORTRAN_PATH"

      - name: Build wheels (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1
          # Explicitly tell gfortran to build for x86_64, even on ARM64 hardware
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=10.13
            ARCHFLAGS="-arch x86_64"
          CIBW_BEFORE_BUILD_MACOS: >
            python compile_fortran.py &&
            echo "Checking h2o92.dylib architecture:" &&
            file pychnosz/fortran/h2o92.dylib &&
            lipo -info pychnosz/fortran/h2o92.dylib

      - name: Build wheels (macOS ARM)
        if: matrix.os == 'macos-latest'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=10.13
            ARCHFLAGS="-arch arm64"
          CIBW_BEFORE_BUILD_MACOS: python compile_fortran.py

      - name: Build wheels (Linux/Windows)
        if: runner.os != 'macOS'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: >
            bash -c "
            if command -v dnf &> /dev/null; then
              dnf install -y gcc-gfortran
            elif command -v yum &> /dev/null; then
              yum install -y gcc-gfortran
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y gfortran
            else
              echo 'No supported package manager found' && exit 1
            fi
            "
          CIBW_BEFORE_ALL_WINDOWS: "echo 'MinGW installed via setup-msys2 action'"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only upload on release
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Use trusted publishing (no API token needed if configured on PyPI)
          # Or you can use: password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
